# Project coordinates. This is the single source of truth for the version -- it used to
# be duplicated across pom.xml, build.properties and changelog.txt.
group=io.github.solcott
version=0.5.0

# A KMP build with fourteen targets plus AGP needs more headroom than the default. Metaspace, not
# heap, is what runs out first: at 1g the daemon expired mid-build once the seven native targets
# were added, and Gradle's own advice was to raise it. Each target adds classes, not live objects.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.code.style=official
# Fail loudly if the Kotlin jvmTarget and Java targetCompatibility ever drift apart.
kotlin.jvm.target.validation.mode=error
# Let a Linux CI job run `build` without the Apple targets aborting configuration.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true
