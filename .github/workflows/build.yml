name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the equivalent of the old `mvn package`.
  jvm:
    name: JVM and Linux native (compile, test, docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # The com.android.kotlin.multiplatform.library plugin needs the SDK present at
      # CONFIGURATION time, even for a JVM-only task.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Check formatting
        run: ./gradlew ktfmtCheck

      - name: Check dependency sorting
        run: ./gradlew checkSortDependencies

      # Runs on the Linux job even though `build` on the macOS job also triggers it via `check`:
      # detekt reads source rather than compiled output, so it covers the Apple source sets here
      # too, and a lint failure is worth hearing about before the 20-minute all-targets job.
      - name: Static analysis
        run: ./gradlew detekt

      # Dokka replaces the old javadocJvm task, which documented the deleted Java tree. On
      # Linux the Apple targets are disabled (kotlin.native.ignoreDisabledTargets), so this
      # documents fewer source sets here than the macOS job does; the jar that ships is built
      # by the release workflow, which runs on macOS.
      # linuxX64Test runs HERE and nowhere else: a Linux binary only executes on a Linux host, so
      # the macOS job skips it. It is the second Kotlin/Native target to actually run the common
      # suite -- of the seven native targets added alongside it, only linuxX64 and mingwX64 have a
      # test run at all, and mingw's needs a Windows runner this build does not have.
      - name: Build JVM target
        run: >-
          ./gradlew :marine-api:jvmJar :marine-api:jvmTest :marine-api:linuxX64Test
          :marine-api:dokkaGeneratePublicationHtml :examples:jvmJar
          :examples-android:assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: |
            marine-api/build/reports/tests/jvmTest
            marine-api/build/reports/tests/linuxX64Test

  # Full multiplatform build. macOS is required -- the Apple targets cannot be linked on Linux,
  # and everything else cross-compiles here, which is what lets the release workflow publish all
  # fourteen publications from a single macOS runner.
  all-targets:
    name: All targets (jvm, android, apple, linux, mingw, android native, js, wasm)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Build
        run: ./gradlew build
