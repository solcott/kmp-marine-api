name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: the equivalent of the old `mvn package`.
  jvm:
    name: JVM (compile, test, javadoc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # The com.android.kotlin.multiplatform.library plugin needs the SDK present at
      # CONFIGURATION time, even for a JVM-only task.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;37.0.0'

      - name: Check formatting
        run: ./gradlew ktfmtCheck

      - name: Check dependency sorting
        run: ./gradlew checkSortDependencies

      - name: Build JVM target
        run: ./gradlew :marine-api:jvmJar :marine-api:jvmTest :marine-api:javadocJvm :examples:jvmJar

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: marine-api/build/reports/tests/jvmTest

  # Full multiplatform build. macOS is required -- the Apple targets cannot be linked
  # on Linux.
  all-targets:
    name: All targets (jvm, android, apple, js, wasm)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37 build-tools;37.0.0'

      - name: Build
        run: ./gradlew build
